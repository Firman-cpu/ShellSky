# ShellSky integration
# Source this file from hyprland.conf after installation.

# Start ShellSky once per session.
exec-once = $HOME/.config/shellsky/scripts/run.sh

# ShellSky controls
bind = $mainMod, SPACE, exec, $HOME/.config/shellsky/scripts/toggle-launcher.sh
bind = $mainMod, N, exec, $HOME/.config/shellsky/scripts/toggle-notifications.sh
bind = $mainMod, C, exec, $HOME/.config/shellsky/scripts/toggle-control-center.sh
