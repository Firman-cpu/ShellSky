  <path d="M0 650 L190 500 L330 590 L505 430 L720 635 L900 510 L1080 650 L1260 470 L1430 590 L1600 445 L1810 600 L1920 520 V1080 H0Z" fill="url(#mountain)"/>
  <path d="M0 730 L250 610 L430 700 L650 565 L850 720 L1040 610 L1240 720 L1450 575 L1640 690 L1810 590 L1920 670 V1080 H0Z" fill="#050d19" opacity=".78"/>

  <rect y="735" width="1920" height="345" fill="url(#water)"/>
  <g opacity=".12" stroke="#8bc2ff" stroke-width="2">
