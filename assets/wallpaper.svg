      <stop offset="1" stop-color="#6caeff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173d62"/>
      <stop offset="1" stop-color="#071323"/>
